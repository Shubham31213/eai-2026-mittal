openapi: 3.0.3
info:
  title: PA6 Checkout Orchestration API
  version: 1.0.0
  contact:
    name: PA6 API Support
  description: >-
    API for processing canonical orders through a checkout saga.
    It coordinates payment, inventory, shipping and notification
    services in sequence and compensates completed reversible steps
    when a later step fails.

servers:
  - url: http://localhost:3000
    description: Local checkout orchestrator.

tags:
  - name: Health
    description: Orchestrator health operations.
  - name: Checkout
    description: Order checkout and saga operations.

paths:
  /health:
    get:
      operationId: getHealth
      tags:
        - Health
      summary: Check orchestrator health
      description: Reports whether the checkout orchestrator is running.
      responses:
        "200":
          description: The orchestrator is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /checkout:
    post:
      operationId: createCheckout
      tags:
        - Checkout
      summary: Process a canonical order
      description: >-
        Processes one canonical order through payment authorization,
        inventory reservation, shipping creation and notification
        delivery. The steps execute sequentially. If a later step fails,
        completed inventory and payment steps are compensated in reverse
        order where applicable.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            Unique client key for this checkout attempt. Repeating the
            same key and payload replays the original result. Reusing
            the key with a different payload is rejected.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        description: The complete canonical order to process.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CanonicalOrder"
      responses:
        "200":
          description: All four checkout steps completed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "400":
          description: The request body or required header is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >-
            The idempotency key conflicts with an active request or
            is being reused with a different request payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >-
            A downstream business operation failed or compensation
            could not be completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "504":
          description: >-
            A downstream operation timed out. Completed reversible
            steps are compensated before the result is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"

components:
  schemas:
    HealthStatus:
      type: object
      description: Health information returned by the orchestrator.
      required:
        - status
      properties:
        status:
          type: string
          description: Health state of the orchestrator.
          enum:
            - ok

    CanonicalOrder:
      type: object
      description: >-
        Canonical order accepted by the checkout orchestrator.
        Its fields and types follow the course canonical order model.
      additionalProperties: false
      required:
        - orderId
        - orderType
        - source
        - receivedAt
        - orderDate
        - customer
        - items
        - currency
        - status
      properties:
        orderId:
          type: string
          minLength: 1
          description: Unique identifier supplied by the source system.
        orderType:
          type: string
          enum:
            - standard
            - express
            - b2b
          description: Business type of the order.
        source:
          type: string
          enum:
            - web
            - mobile
            - b2b
          description: Source that produced the canonical order.
        receivedAt:
          type: string
          format: date-time
          description: Time when the canonical translator produced the order.
        orderDate:
          type: string
          format: date-time
          description: Original order timestamp normalized to ISO-8601.
        customer:
          type: object
          description: Customer details and delivery address.
          additionalProperties: false
          required:
            - name
            - email
            - address
          properties:
            name:
              type: string
              minLength: 1
              description: Customer's full name.
            email:
              type: string
              format: email
              description: Customer email used for the completion notification.
            address:
              type: object
              description: Customer postal address.
              additionalProperties: false
              required:
                - street
                - city
                - postalCode
                - country
              properties:
                street:
                  type: string
                  minLength: 1
                  description: Street and house information.
                city:
                  type: string
                  minLength: 1
                  description: City of the customer.
                postalCode:
                  type: string
                  minLength: 1
                  description: Postal code of the customer.
                country:
                  type: string
                  description: ISO 3166-1 alpha-2 country code.
        items:
          type: array
          description: >-
            Products included in the order. At least one item is required.
            The limit of 100 items keeps individual checkout requests bounded.
          minItems: 1
          maxItems: 100
          items:
            type: object
            description: One product line in the order.
            additionalProperties: false
            required:
              - productId
              - productName
              - quantity
              - unitPrice
              - currency
              - taxRate
            properties:
              productId:
                type: string
                pattern: '^PROD-[0-9]+$'
                description: Product identifier in the pricing API format.
              productName:
                type: string
                minLength: 1
                description: Name of the ordered product.
              quantity:
                type: integer
                minimum: 1
                description: Number of units ordered.
              unitPrice:
                type: string
                pattern: '^-?[0-9]+\.[0-9]{2}$'
                description: Unit price as a decimal string with two fraction digits.
              currency:
                type: string
                description: Currency used for this item's unit price.
              taxRate:
                type: number
                minimum: 0
                maximum: 1
                description: Tax rate expressed as a fraction between zero and one.
        currency:
          type: string
          description: Currency declared for the complete order.
        status:
          type: string
          enum:
            - new
            - processing
            - shipped
            - delivered
          description: Current business status of the order.

    TraceItem:
      type: object
      description: Record of one executed saga or compensation step.
      required:
        - step
        - status
        - startedAt
        - finishedAt
        - durationMs
      properties:
        step:
          type: string
          minLength: 1
          description: Name of the executed step.
        status:
          type: string
          minLength: 1
          description: Result of the step, such as success, failed or timeout.
        startedAt:
          type: string
          format: date-time
          description: Timestamp when the step started.
        finishedAt:
          type: string
          format: date-time
          description: Timestamp when the step finished.
        durationMs:
          type: integer
          minimum: 0
          description: Time spent executing the step in milliseconds.

    CheckoutResponse:
      type: object
      description: Final result and execution trace of a checkout saga.
      required:
        - orderId
        - status
        - trace
      properties:
        orderId:
          type: string
          minLength: 1
          description: Identifier of the processed order.
        status:
          type: string
          enum:
            - completed
            - failed
            - compensated
            - in_progress
          description: Final or current state of the saga.
        code:
          type: string
          description: Machine-readable reason for a non-successful result.
        trace:
          type: array
          description: >-
            Execution history in actual order, including compensation
            steps. Four normal steps and up to two compensation steps
            are possible.
          maxItems: 6
          items:
            $ref: "#/components/schemas/TraceItem"

    ErrorResponse:
      type: object
      description: Error information for invalid or conflicting requests.
      required:
        - code
        - message
      properties:
        code:
          type: string
          minLength: 1
          description: Stable machine-readable error code.
        message:
          type: string
          minLength: 1
          description: Human-readable explanation of the error.